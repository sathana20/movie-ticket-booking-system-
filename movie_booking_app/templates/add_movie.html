{% extends "base.html" %}
{% block title %}Add Movie{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Add New Movie</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Genre</label>
      <input type="text" name="genre" placeholder="Action, Drama, Comedy...">
    </div>
    <div class="form-group">
      <label>Language</label>
      <input type="text" name="language" placeholder="English, Hindi, Tamil...">
    </div>
    <div class="form-group">
      <label>Duration (minutes)</label>
      <input type="number" name="duration_minutes" min="1">
    </div>
    <div class="form-group">
      <label>Poster Image</label>
      <input type="file" name="poster" accept="image/*">
    </div>
    <button type="submit" class="btn btn-block">Add Movie</button>
  </form>
</div>
{% endblock %}
