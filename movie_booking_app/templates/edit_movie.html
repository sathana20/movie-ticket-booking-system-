{% extends "base.html" %}
{% block title %}Edit Movie{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Edit "{{ movie.title }}"</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" value="{{ movie.title }}" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="3">{{ movie.description or '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Genre</label>
      <input type="text" name="genre" value="{{ movie.genre or '' }}" placeholder="Action, Drama, Comedy...">
    </div>
    <div class="form-group">
      <label>Language</label>
      <input type="text" name="language" value="{{ movie.language or '' }}" placeholder="English, Hindi, Tamil...">
    </div>
    <div class="form-group">
      <label>Duration (minutes)</label>
      <input type="number" name="duration_minutes" value="{{ movie.duration_minutes or '' }}" min="1">
    </div>
    <div class="form-group">
      <label>Poster Image</label>
      {% if movie.poster_filename %}
        <div style="margin-bottom:10px;">
          <img src="{{ url_for('static', filename='uploads/' + movie.poster_filename) }}" style="width:80px;height:110px;object-fit:cover;border-radius:6px;">
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">Current poster — upload a new file below to replace it</div>
        </div>
      {% endif %}
      <input type="file" name="poster" accept="image/*">
    </div>
    <button type="submit" class="btn btn-block">Save Changes</button>
  </form>
</div>
{% endblock %}
